version: 2

# Version updates target develop, like any other contribution. Security updates
# are configured in the repository settings and open against the default branch.
updates:
  - package-ecosystem: npm # reads package.json and pnpm-lock.yaml
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    # Pinned by the override in pnpm-workspace.yaml until Starlight moves to
    # satteri 0.11: 0.4.7+ breaks the build.
    ignore:
      - dependency-name: "@astrojs/markdown-satteri"

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
