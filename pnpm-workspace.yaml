allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - '@astrojs/starlight@0.42.9'
# Starlight bundles satteri 0.10 and loads whichever native binding pnpm
# hoists: @astrojs/markdown-satteri 0.4.7+ brings satteri 0.11, whose binding
# breaks the build (Invalid typed array length). Keep one satteri version until
# Starlight moves to 0.11.
overrides:
  '@astrojs/markdown-satteri': 0.4.6
